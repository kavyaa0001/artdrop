<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArtDrop - My 4K Vault</title>
  <link rel="icon" href="../images/favicon.png?v=2" type="image/png">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    :root {
      --background: #ffffff !important;
      --foreground: #000000 !important;
    }
    body {
      background: #ffffff !important;
      color: #000000 !important;
      font-family: 'Karla', sans-serif;
    }
    .vault-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 30px -10px rgba(0, 0, 0, 0.06);
      transition: all 0.25s ease;
    }
    .vault-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.12);
      border-color: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Top Navbar -->
  <header class="border-b border-black/10 bg-white sticky top-0 z-40">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-4">
        <a href="/" class="flex items-center">
          <img src="../images/artdrop-logo.webp?v=2" alt="ArtDrop" class="h-10 w-auto">
        </a>
        <span class="rounded-full bg-emerald-100 px-3 py-0.5 text-[10px] font-bold uppercase tracking-widest text-emerald-800">
          VIP 4K Vault
        </span>
      </div>

      <div class="flex items-center gap-6">
        <a href="/" class="text-xs font-bold uppercase tracking-wider text-neutral-600 hover:text-black">Home</a>
        <div id="vault-auth-pill"></div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-10">

    <!-- Hero Greeting -->
    <div class="mb-10 text-center sm:text-left sm:flex sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-black">Masterpiece Collection</h1>
        <p class="text-xs sm:text-sm text-neutral-500 mt-1">High-bitrate, uncompressed 4K & 8K impasto oil-painting wallpapers.</p>
      </div>
      <div id="vault-access-badge" class="mt-4 sm:mt-0"></div>
    </div>

    <!-- Category Filter Tabs -->
    <div id="category-filter-bar" class="mb-8 flex flex-wrap gap-2">
      <button data-cat="all" class="cat-pill active rounded-full bg-black px-4 py-1.5 text-xs font-bold uppercase tracking-wider text-white">All Masterpieces</button>
      <button data-cat="Cars & Supercars" class="cat-pill rounded-full bg-neutral-100 hover:bg-neutral-200 px-4 py-1.5 text-xs font-bold uppercase tracking-wider text-black">Cars</button>
      <button data-cat="Luxury & Wealth" class="cat-pill rounded-full bg-neutral-100 hover:bg-neutral-200 px-4 py-1.5 text-xs font-bold uppercase tracking-wider text-black">Luxury</button>
      <button data-cat="Animals & Power" class="cat-pill rounded-full bg-neutral-100 hover:bg-neutral-200 px-4 py-1.5 text-xs font-bold uppercase tracking-wider text-black">Animals</button>
      <button data-cat="Cinema & Characters" class="cat-pill rounded-full bg-neutral-100 hover:bg-neutral-200 px-4 py-1.5 text-xs font-bold uppercase tracking-wider text-black">Cinema</button>
    </div>

    <!-- Wallpapers Grid -->
    <div id="vault-wallpapers-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Loaded dynamically via vault.js -->
    </div>

    <!-- Locked State (if user has not paid) -->
    <div id="vault-locked-banner" class="hidden my-12 rounded-3xl border border-black/15 bg-neutral-50 p-8 sm:p-12 text-center">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-black text-white mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-black mb-2">Vault Is Currently Locked</h2>
      <p class="text-xs text-neutral-500 max-w-md mx-auto mb-6">You need an active ArtDrop VIP Pass to download full-resolution, uncompressed 4K Desktop and Phone wallpapers.</p>
      <a href="/#oferta" class="inline-block rounded-full bg-black px-8 py-3.5 text-xs font-bold uppercase tracking-widest text-white shadow-xl hover:bg-neutral-800 transition">
        Unlock VIP Vault Now
      </a>
    </div>

  </main>

  <script type="module" src="./vault.js?v=5"></script>
</body>
</html>
